<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Interview Console</title>
<style>
  :root{
    --bg:#f7f6f3; --panel:#fffefc; --ink:#15171c; --ink-2:#565b6b; --ink-3:#8a90a0;
    --line:#e3e0d8; --accent:#2f5fe0; --accent-soft:#e8eefc;
    --ok:#0f7a45; --ok-soft:#e6f4ec; --warn:#a3540b; --warn-soft:#fdf1e2;
    --rail:224px; --radius:14px;
    --k-setup:#8a90a0; --k-tension:#c8791a; --k-action:#2f5fe0; --k-result:#0f7a45; --k-close:#5b3fd6;
    --mono:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
    --sans:-apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",Inter,system-ui,"PingFang SC","Hiragino Sans GB",sans-serif;
  }
  @media (prefers-color-scheme: dark){
    :root{
      --bg:#131519; --panel:#181b21; --ink:#e9e7e2; --ink-2:#a7adbb; --ink-3:#767c8b;
      --line:#282c34; --accent:#7ea2ff; --accent-soft:#1b2340;
      --k-setup:#8d93a3; --k-tension:#e0a45c; --k-action:#7ea2ff; --k-result:#5fce92; --k-close:#a58bff;
      --ok:#5fce92; --ok-soft:#12291e; --warn:#e2a35c; --warn-soft:#2c2216;
    }
  }
  *{box-sizing:border-box}
  html{scroll-behavior:smooth}
  body{margin:0; background:var(--bg); color:var(--ink); font-family:var(--sans); font-size:16px; line-height:1.55; -webkit-font-smoothing:antialiased}

  /* ---------- left rail ---------- */
  aside.rail{
    position:fixed; top:0; left:0; bottom:0; width:var(--rail); z-index:30;
    background:var(--panel); border-right:1px solid var(--line);
    padding:18px 14px 24px; overflow-y:auto;
    scrollbar-width:none; -ms-overflow-style:none;
  }
  aside.rail::-webkit-scrollbar{display:none; width:0; height:0}
  .rail-brand{font-weight:700; font-size:15px; letter-spacing:-.01em; line-height:1.3}
  .rail-brand span{display:block; font-weight:500; font-size:12px; color:var(--ink-3); margin-top:2px}
  .lang{display:inline-flex; border:1px solid var(--line); border-radius:999px; overflow:hidden; margin:14px 0 18px}
  .lang button{font:inherit; font-size:12.5px; padding:4px 14px; border:0; background:transparent; color:var(--ink-3); cursor:pointer}
  .lang button[aria-pressed="true"]{background:var(--ink); color:var(--bg)}
  .rail nav{display:block; scrollbar-width:none; -ms-overflow-style:none}
  .rail nav::-webkit-scrollbar{display:none; width:0; height:0}
  .rail a{
    display:block; font-size:13.5px; color:var(--ink-2); padding:5px 9px; border-radius:8px;
    text-decoration:none; border-left:2px solid transparent;
  }
  .rail a:hover{background:var(--bg); color:var(--ink)}
  .rail a.on{color:var(--accent); border-left-color:var(--accent); background:var(--accent-soft)}
  .rail .sec{font-size:11px; text-transform:uppercase; letter-spacing:.14em; color:var(--ink-3); margin:16px 0 6px; padding-left:9px}
  .rail a.sub{font-size:13px; padding-left:18px; color:var(--ink-3)}
  .rail a.sub.on{color:var(--accent)}
  .rail-head{margin-top:22px}

  .content{margin-left:var(--rail)}
  main{max-width:1060px; margin:0 auto; padding:34px 30px 90px}
  section{margin:0 0 48px; scroll-margin-top:24px}
  h2{font-size:13px; text-transform:uppercase; letter-spacing:.13em; color:var(--ink-3); margin:0 0 14px; font-weight:600}
  h2 b{color:var(--ink)}
  .lead{font-size:17px; color:var(--ink-2); margin:-4px 0 24px; max-width:70ch}

  @media (max-width:1000px){
    aside.rail{position:fixed; top:auto; bottom:0; left:0; right:0; width:auto; z-index:40;
      display:flex; align-items:center; gap:10px; border-right:0; border-top:1px solid var(--line);
      padding:5px 12px calc(7px + env(safe-area-inset-bottom));
      background:color-mix(in srgb, var(--panel) 92%, transparent);
      backdrop-filter:blur(14px); -webkit-backdrop-filter:blur(14px)}
    .content{margin-left:0}
    .rail-top{order:2; flex:0 0 auto; display:flex; align-items:center; gap:8px}
    .rail-brand{display:none}
    .lang{margin:0}
    .lang button{padding:3px 10px; font-size:12px}
    .rail nav{order:1; flex:1 1 auto; display:flex; gap:4px; overflow-x:auto; padding-bottom:0; -webkit-overflow-scrolling:touch}
    .rail a{border-left:0; border-bottom:2px solid transparent; white-space:nowrap; padding:6px 9px; font-size:12.5px}
    .rail a.on{border-left:0; border-bottom-color:var(--accent)}
    .rail .sec,.rail-head{display:none}
    main{padding:14px 16px calc(78px + env(safe-area-inset-bottom))}
    section{scroll-margin-top:12px}
  }

  /* ---------- loop ---------- */
  .loop{display:grid; grid-template-columns:repeat(5,1fr); gap:10px}
  .step{background:var(--panel); border:1px solid var(--line); border-radius:var(--radius); padding:14px; position:relative; min-height:128px}
  .step .n{font-family:var(--mono); font-size:11px; color:var(--ink-3); display:block; margin-bottom:8px}
  .step h3{margin:0 0 6px; font-size:15.5px}
  .step p{margin:0; font-size:13.5px; color:var(--ink-2); line-height:1.45}
  .step.key{border-color:var(--accent); background:var(--accent-soft)}
  .step.key h3{color:var(--accent)}
  .step:not(:last-child)::after{content:"→"; position:absolute; right:-11px; top:50%; transform:translateY(-50%); color:var(--ink-3); background:var(--bg); padding:2px 0}
  @media (max-width:860px){ .loop{grid-template-columns:1fr 1fr} .step:not(:last-child)::after{content:""} }

  .day{background:var(--panel); border:1px solid var(--line); border-left:3px solid var(--accent); border-radius:12px; padding:16px 18px; margin-bottom:18px}
  .day h3{margin:0 0 6px; font-size:15px}
  .day .deadline{font-family:var(--mono); font-size:12.5px; color:var(--warn); margin:0 0 12px; letter-spacing:.01em}
  .day ul{margin:0; padding-left:20px; font-size:13.5px; color:var(--ink-2); columns:2; column-gap:26px}
  .day li{margin:0 0 5px; break-inside:avoid}
  .day a{font-family:var(--mono); font-size:12.5px}
  @media (max-width:760px){ .day ul{columns:1} }
  .chips{display:flex; flex-wrap:wrap; gap:8px; margin-top:16px}
  .chip{background:var(--panel); border:1px solid var(--line); border-radius:999px; padding:6px 13px; font-size:13.5px; color:var(--ink-2)}
  .chip b{color:var(--ink); font-variant-numeric:tabular-nums}
  .chip.hot{border-color:var(--accent); background:var(--accent-soft); color:var(--accent)}
  .chip.hot b{color:var(--accent)}
  .changed{margin-top:16px; display:grid; grid-template-columns:repeat(auto-fit,minmax(230px,1fr)); gap:10px}
  .changed div{background:var(--warn-soft); border:1px solid color-mix(in srgb, var(--warn) 30%, transparent); border-radius:12px; padding:11px 13px; font-size:13.5px}
  .changed b{color:var(--warn)}
  @media (max-width:860px){.changed{grid-template-columns:1fr}}

  /* ---------- tree ---------- */
  .treenote{border:1px solid var(--line); border-left:3px solid var(--accent); border-radius:10px; padding:12px 15px; margin:-8px 0 18px; font-size:13.5px; color:var(--ink-2); max-width:88ch}
  .treenote b{color:var(--ink)}
  .tabs{display:flex; gap:6px; flex-wrap:wrap; margin-bottom:16px}
  .tabs button{font:inherit; font-size:13.5px; cursor:pointer; padding:7px 14px; border-radius:999px; border:1px solid var(--line); background:var(--panel); color:var(--ink-2)}
  .tabs button:hover{color:var(--ink)}
  .tabs button[aria-pressed="true"]{background:var(--ink); color:var(--bg); border-color:var(--ink)}
  .branch-title{display:flex; align-items:baseline; gap:10px; margin:22px 0 12px}
  .branch-title h3{margin:0; font-size:15px}
  .branch-title span{font-size:13px; color:var(--ink-3)}
  .leaves{display:grid; grid-template-columns:repeat(auto-fill,minmax(260px,1fr)); gap:10px}
  .leaf{background:var(--panel); border:1px solid var(--line); border-radius:12px; padding:12px 14px}
  .leaf .id{font-family:var(--mono); font-size:11.5px; color:var(--accent); display:block; margin-bottom:4px}
  .leaf h4{margin:0 0 4px; font-size:14.5px}
  .leaf .tests{margin:0 0 8px; font-size:13px; color:var(--ink-2)}
  .leaf .fill{font-size:12.5px; color:var(--ink-2); border-top:1px dashed var(--line); padding-top:7px}
  .leaf .fill b{color:var(--ink)}

  /* ---------- stories ---------- */
  .stories{display:grid; grid-template-columns:repeat(auto-fill,minmax(310px,1fr)); gap:12px}
  .story{background:var(--panel); border:1px solid var(--line); border-radius:var(--radius); padding:16px 18px}
  .story h3{margin:0 0 2px; font-size:15.5px}
  .story .tag{font-size:12.5px; color:var(--ink-3); margin-bottom:10px; display:block}
  .story ul{margin:0 0 12px; padding-left:18px; font-size:13.5px; color:var(--ink-2)}
  .story li{margin:3px 0}
  .story .close{font-size:13.5px; font-style:italic; border-left:3px solid var(--accent); padding-left:11px; margin:0}

  /* ---------- spines ---------- */
  .spines{display:grid; grid-template-columns:repeat(auto-fill,minmax(230px,1fr)); gap:10px; margin-bottom:20px}
  .spine{background:var(--panel); border:1px solid var(--line); border-radius:12px; padding:13px 15px}
  .spine h3{margin:0 0 3px; font-size:14.5px}
  .spine .use{font-size:12.5px; color:var(--accent); margin-bottom:7px}
  .spine p{margin:0; font-size:13px; color:var(--ink-2); line-height:1.5}
  .frames{display:grid; grid-template-columns:repeat(auto-fill,minmax(250px,1fr)); gap:12px}
  .frame{background:var(--panel); border:1px solid var(--line); border-radius:12px; padding:13px 15px}
  .frame h4{margin:0 0 8px; font-size:12.5px; text-transform:uppercase; letter-spacing:.1em; color:var(--ink-3)}
  .frame p{margin:0 0 8px; font-size:13.5px; font-family:var(--mono); line-height:1.5}
  .gloss{display:block; font-family:var(--sans); font-size:12.5px; color:var(--ink-3); margin-top:3px}

  /* ---------- scripts ---------- */
  .scriptbar{display:flex; align-items:center; gap:10px; margin-bottom:14px}
  .scriptbar .count{font-size:13px; color:var(--ink-3)}
  .scriptbar button{font:inherit; font-size:13px; padding:5px 12px; border-radius:999px; border:1px solid var(--line); background:var(--panel); color:var(--ink-2); cursor:pointer}
  details.script{background:var(--panel); border:1px solid var(--line); border-radius:12px; margin-bottom:10px; overflow:hidden; scroll-margin-top:20px}
  details.script[open]{border-color:color-mix(in srgb, var(--accent) 45%, var(--line))}
  details.script summary{cursor:pointer; padding:14px 16px; list-style:none; display:block}
  details.script summary::-webkit-details-marker{display:none}
  .stitle{display:flex; align-items:center; gap:10px; font-weight:600; font-size:15.5px}
  .stitle .code{font-family:var(--mono); font-size:11.5px; color:var(--accent); font-weight:500}
  .stitle .plus{margin-left:auto; font-family:var(--mono); color:var(--accent); font-size:13px}
  .shell{font-size:13px; color:var(--ink-3); margin:4px 0 0 0}
  .k-setup{--kc:var(--k-setup)} .k-tension{--kc:var(--k-tension)} .k-action{--kc:var(--k-action)}
  .k-result{--kc:var(--k-result)} .k-close{--kc:var(--k-close)}
  .legend{display:flex; gap:16px; flex-wrap:wrap; margin:0 0 14px; font-size:12.5px; color:var(--ink-2)}
  .legend span{display:inline-flex; align-items:center; gap:6px}
  .legend i{width:11px; height:11px; border-radius:3px; background:var(--kc); display:block}
  .sbody{padding:2px 16px 18px; border-top:1px dashed var(--line)}
  .keys{font-family:var(--mono); font-size:12.5px; color:var(--ink-2); background:var(--accent-soft); border-radius:9px; padding:9px 12px; margin:14px 0 16px; line-height:1.7}
  .board{display:grid; grid-template-columns:repeat(auto-fill,minmax(272px,1fr)); gap:12px; margin-top:16px; align-items:start}
  .blk{position:relative; background:color-mix(in srgb, var(--kc) 6%, var(--panel)); border:1px solid var(--line); border-radius:14px; padding:15px 16px 16px; box-shadow:0 1px 2px rgba(0,0,0,.035); transition:opacity .18s, transform .18s, box-shadow .18s; cursor:pointer}
  .bhead{display:flex; align-items:center; gap:9px; margin:0 0 11px}
  .spine-line{font-size:12.5px; color:var(--ink-3); margin:9px 0 0; letter-spacing:.01em}
  .bnum{font-family:var(--mono); font-size:11.5px; width:23px; height:23px; border-radius:50%; background:var(--kc); color:#fff; display:grid; place-items:center; flex:none}
  .blab{font-size:12.5px; font-weight:700; letter-spacing:.07em; text-transform:uppercase; color:var(--kc)}
  .blk p{margin:0 0 8px; font-size:15.5px; line-height:1.5}
  .blk p.zh{margin:0 0 3px}
  .blk p.sub{font-size:13px; color:var(--ink-3); line-height:1.45; margin:0 0 9px}
  .blk p:last-child{margin-bottom:0}
  .board.focusing .blk{opacity:.28}
  .board.focusing .blk.focus{opacity:1; transform:translateY(-2px); box-shadow:0 8px 22px rgba(0,0,0,.10)}
  .focushint{font-size:12.5px; color:var(--ink-3); margin:12px 0 0}
  .claimtable{width:100%; border-collapse:collapse; margin-top:16px; font-size:13.5px}
  .claimtable th{text-align:left; font-size:11.5px; text-transform:uppercase; letter-spacing:.08em; color:var(--ink-3); padding:0 12px 6px 0; border-bottom:1px solid var(--line)}
  .claimtable td{padding:9px 12px 9px 0; border-bottom:1px solid var(--line); color:var(--ink-2); vertical-align:top}
  .claimtable td.q{color:var(--ink); font-style:italic}
  .script-note{font-size:13px; color:var(--warn); margin:14px 0 0}


  /* ---------- drill ---------- */
  .drill{background:var(--panel); border:1px solid var(--line); border-radius:var(--radius); padding:22px; display:grid; grid-template-columns:1.1fr .9fr; gap:26px}
  @media (max-width:820px){.drill{grid-template-columns:1fr}}
  .qtext{font-size:20px; line-height:1.45; margin:0 0 16px}
  .btn{font:inherit; font-size:14px; cursor:pointer; border-radius:10px; padding:9px 16px; border:1px solid var(--ink); background:var(--ink); color:var(--bg); font-weight:600}
  .btn.ghost{background:transparent; color:var(--ink); border-color:var(--line)}
  .btn:disabled{opacity:.45; cursor:not-allowed}
  .btnrow{display:flex; gap:8px; flex-wrap:wrap}
  .guess{display:flex; gap:8px; flex-wrap:wrap; margin:14px 0}
  .guess button{font:inherit; font-size:13.5px; cursor:pointer; padding:8px 13px; border-radius:9px; border:1px solid var(--line); background:var(--bg); color:var(--ink)}
  .guess button.right{border-color:var(--ok); background:var(--ok-soft); color:var(--ok)}
  .guess button.wrong{border-color:var(--warn); background:var(--warn-soft); color:var(--warn)}
  .feedback{font-size:13.5px}
  .feedback b{color:var(--ok)}
  .feedback i{color:var(--warn); font-style:normal}
  .metre{background:var(--bg); border:1px solid var(--line); border-radius:12px; padding:16px; align-self:start}
  .metre h4{margin:0 0 12px; font-size:12.5px; text-transform:uppercase; letter-spacing:.1em; color:var(--ink-3)}
  .clock{font-family:var(--mono); font-size:40px; font-variant-numeric:tabular-nums; line-height:1}
  .clock small{font-size:14px; color:var(--ink-3); margin-left:6px}
  .bar{height:9px; background:var(--line); border-radius:99px; margin:14px 0 6px; overflow:hidden; position:relative}
  .bar i{display:block; height:100%; width:0; background:var(--accent); border-radius:99px; transition:width .25s linear}
  .bar.speaking i{background:var(--ok)}
  .bar .mark{position:absolute; top:-3px; bottom:-3px; width:2px; background:var(--ink-3); opacity:.5}
  .metre .hint{font-size:12.5px; color:var(--ink-3)}
  .stat{font-size:13px; color:var(--ink-2); margin-top:14px; border-top:1px dashed var(--line); padding-top:10px}
  footer{max-width:1060px; margin:0 auto; padding:0 30px 60px; color:var(--ink-3); font-size:12.5px}
  @media print{ aside.rail{display:none} .content{margin-left:0} .drill{display:none} }
</style>
</head>
<body>

<aside class="rail">
  <div class="rail-top">
    <div class="rail-brand" id="brand"></div>
    <div class="lang" role="group" aria-label="Language">
      <button id="lang-en" aria-pressed="true">EN</button>
      <button id="lang-zh" aria-pressed="false">中文</button>
    </div>
  </div>
  <nav id="railnav"></nav>
</aside>

<div class="content">
  <main>
    <section id="day"><h2 id="day-h"></h2><div class="day" id="day-box"></div></section>
    <section id="loop"><h2 id="loop-h"></h2><p class="lead" id="loop-lead"></p><div class="loop" id="loop-grid"></div><div class="chips" id="chips"></div><div class="changed" id="changed"></div></section>
    <section id="tree"><h2 id="tree-h"></h2><p class="lead" id="tree-lead"></p><p class="treenote" id="tree-note"></p><div class="tabs" id="tabs"></div><div id="tree-body"></div></section>
    <section id="stories"><h2 id="stories-h"></h2><p class="lead" id="stories-lead"></p><div class="stories" id="story-grid"></div></section>
    <section id="spines"><h2 id="spines-h"></h2><p class="lead" id="spines-lead"></p><div class="spines" id="spine-grid"></div><div class="frames" id="frame-grid"></div></section>
    <section id="scripts"><h2 id="scripts-h"></h2><p class="lead" id="scripts-lead"></p>
      <div class="legend" id="legend"></div>
      <div class="scriptbar"><button id="togall"></button><span class="count" id="scount"></span></div>
      <div id="script-list"></div>
    </section>
    <section id="drill"><h2 id="drill-h"></h2><p class="lead" id="drill-lead"></p>
      <div class="drill">
        <div>
          <p class="qtext" id="qtext"></p>
          <div class="btnrow"><button class="btn" id="draw"></button><button class="btn ghost" id="again" style="display:none"></button></div>
          <div class="guess" id="guess" style="display:none"></div>
          <p class="feedback" id="feedback"></p>
        </div>
        <div class="metre">
          <h4 id="clock-h"></h4>
          <div class="clock" id="clock"></div>
          <div class="bar" id="bar"><span class="mark" style="left:100%"></span><i id="fill"></i></div>
          <p class="hint" id="hint"></p>
          <div class="btnrow" style="margin-top:14px"><button class="btn ghost" id="prep" disabled></button><button class="btn ghost" id="speak" disabled></button></div>
          <div class="stat"><span id="stats"></span></div>
        </div>
      </div>
    </section>
  </main>
  <footer id="foot"></footer>
</div>

<script>
/* ================= UI ================= */
const UI = {
  en:{
    brand:"Interview Console<span>CUHK MiM · 2026-10-10</span>",
    sec:["The loop","The question tree","Six stories","Spines and sentence frames","Scripts","The drill"],
    daySec:"On the day",
    dayTitle:"The interview link is live",
    dayDeadline:"Link expires 17:00 HKT, Sunday 11 October. Do it early, not at the last minute.",
    daySteps:["Open <a href=\"https://myint.video/avP3k_qgO2\">myint.video/avP3k_qgO2</a> in Chrome or Firefox, in a private window.",
              "Check your name. Then test camera and microphone in Practice mode. Practice answers are not submitted.",
              "5–6 questions. You get 30 seconds to review each one, then recording starts by itself.",
              "One attempt per question. No pause, no restart, no going back.",
              "Your face must be visible, or the submission is invalid.",
              "At the end press Submit and wait for the confirmation message."],
    dayHelp:"Problems during recording: candidates@myinterview.com, 24 hours a day.",
    leads:[
      "Every answer runs the same five steps. You get 30 seconds to review the question before recording starts, so the loop has to fit inside that.",
      "Every question lands on one branch. Name the branch first, then everything else follows.",
      "Not scripts. The facts you can reach for, plus the one line that closes each one.",
      "The spine decides the shape of the answer. The frames are whole sentences you can start with, so you never freeze mid-thought.",
      "Each script is cut into blocks. The blocks are the spine, so learn the block names first and the sentences second. Say them out loud; every line is short enough for one breath.",
      "Draw a question, name its branch, then run the clock the way the interview does."
    ],
    stepN:"STEP",
    chips:["Review each question <b>30 s</b>","Speak <b>150–165 s</b>","Hard limit <b>180 s</b>","Questions <b>5–6</b>","Result in <b>~15 working days</b>"],
    changed:["<b>Fixed 10/10.</b> New card: the wildcard — one lens (time) that fits any odd question.",
             "<b>Fixed 10/10.</b> C2 point two is thinking for itself now, with the Feishu–Doubao call as the example.",
             "<b>Fixed 10/10.</b> The persuasion script now covers leading too: the intern squad, the UI pushback.",
             "<b>Fixed 10/10.</b> Low-frequency scripts (other programmes, the nuclear project) moved to the end."],
    tabs:["All","A · Person &amp; motive","B · Experience","C · Business","D · Open"],
    treeNote:"<b>Four parallel buckets.</b> The platform draws up to two questions from each bucket, so when a question is asked it belongs to one branch. The leaves overlap, though: \"why did you switch from film to management\" sits on A1 or A2, and \"a problem you solved with almost no resources\" sits on B1 or B3. When two leaves fit, take the one where your story is strongest and answer in that shape. The same question never repeats inside one interview; two different leaves from the same bucket can both come up.",
    fillLabel:"Use", useLabel:"Use:", watchLabel:"Watch out:", sits:"It sits on", correct:"Yes —",
    keyLabel:"Keyword map", hearLabel:"You'll hear", spineLabel:"Spine",
    draw:"Draw a question", again:"Next question", prep:"Start prep", speak:"Start speaking",
    clockH:"Clock", prepUnit:"s prep", speakUnit:"s speaking",

  },
  {
    id:"s-challenge", code:"B1", kinds:["setup","tension","action","result","close"],
    en:{t:"Internship challenge", hear:"What was the most challenging internship you had?",
        spine:"The scale → The culture → The work → Result → Close",
        keys:"TikTok ｜ 150+ countries, a billion-plus users a month, still growing ｜ user growth behind it, paid ads is one lever ｜ face-first culture, nobody guides you ｜ definitions unwritten ｜ 80 hours a month",
        blocks:[
          {l:"The scale", lines:["The hardest one is my current internship at ByteDance.","I work on a general-purpose agent, for the paid ads business.","Let me give you the scale first, because that is what makes this business complex.","TikTok covers more than 150 countries, with over a billion users a month, and it is still growing.","Growth at that scale does not happen on its own.","Behind it there is a whole user growth effort, and paid advertising is one of its main levers.","My product sits on that line, and the data behind it crosses many countries, many channels, and a huge number of metrics."]},
          {l:"The culture", lines:["The second layer is the culture.","At ByteDance, every intern lands face-first.","Nobody stops their own work to walk you through anything.","You are expected to work it out yourself, and fast.","And my task sat right in the middle of those two layers.","For the agent to answer anything correctly, every metric has to be defined first, what it means, how it is calculated, which field it comes from.","A lot of that was never written down. It was word of mouth."]},
          {l:"The work", lines:["So I went and found the people who actually knew.","One definition at a time, the data team, the business side, whoever made the call.","I wrote each one down, and kept the dictionary alive, because a definition nobody maintains is worthless.","Then I built the evaluation system on top of it, so we could measure whether the answers were getting better.","Those definitions were not mine to decide. But getting them confirmed was on me."]},
          {l:"Result", lines:["The agent now saves the business about 80 hours a month.","And every iteration is measurable, so we know what actually improved."]},
          {l:"Close", lines:["So what made it hard was not just the size of the business.","It was that nobody stops to hand you the answers, in a business of that size.","I worked it out, and the dictionary is still there, so the next person does not start from zero."]}
        ],
        notes:["Scale first, then culture. Do not assert complexity, show it: 150+ countries and a billion-plus users are public figures, safe to say. Never quote internal data.","The culture layer is what makes this story hard: nobody guides you. Do not play it as a complaint, it is the reason the story counts.","One story only. Meituan can come back as a single line at the end if you need it.","If asked which team: answer \"the paid ads product line\" and stop. Do not map the org chart."]},
    zh:{t:"实习里最大的挑战", hear:"你最有挑战的一段实习是什么？",
        spine:"体量有多大 → 文化：没人带 → 行动 → 结果 → 收口",
        keys:"TikTok 体量 ｜ 150+ 国家、月活十亿以上、还在涨 ｜ 增长背后是用户增长体系，付费广告是抓手之一 ｜ 脸朝地文化，没人带 ｜ 定义没写下来 ｜ 每月 80 小时",
        labels:["体量有多大","文化：没人带","行动","结果","收口"],
        lines:[
          ["最难的是我现在在字节的这段实习。","我负责的是付费广告业务的通用智能体。","先摆体量，因为业务的复杂度就在这里。","TikTok 覆盖 150 多个国家，月活用户十亿以上，而且还在增长。","这个量级的增长不会自己发生。","背后是整个用户增长体系在支撑，付费广告是其中一个主要抓手。","我的产品就在这条线上，背后的数据横跨很多国家、很多渠道，指标数量非常大。"],
          ["第二层是文化。","在字节，每个实习生都是脸朝地摔进来的。","没有人会停下自己的活，专门带你。","预期就是你自己把它弄明白，而且要快。","而我接的活，正好卡在这两层的中间。","智能体要答对任何东西，前提是每个指标先被定义清楚：它是什么意思、怎么算、取哪个字段。","很多定义从来没被写下来过，是口口相传的。"],
          ["所以我自己去找真正知道的人。","一个定义一个定义地确认：数据团队、业务侧、谁拍过板就找谁。","我把每一条都记下来，并且让这本字典一直活着——没人维护的定义等于没有。","然后我在这套底座上搭了评测体系，迭代到底有没有变好，是能测出来的。","定义不是我能拍板的，但把它确认下来是我的事。"],
          ["现在这个智能体每月给业务侧省下大约 80 小时。","而且每次迭代都可衡量，我们知道到底改进了什么。"],
          ["所以难的不只是业务体量。","是这么大的业务，还没有人停下来把答案递给你。","我自己把它弄明白了，而且这本字典还在，后面的人不用从零开始。"]
        ],
        notes:["先摆体量，再讲文化。150 多个国家、月活十亿以上是公开数字，可以讲；内部数据一个都不能提。","文化那段是这个故事真正难的地方：没人带。别讲成抱怨，它是这段经历有分量的原因。","只讲一个故事。需要的话，美团最多在最后补一句。","被问在哪个部门：答到「付费广告产品线」为止，别展开内部架构。"]}
  },
  {
    id:"s-team", code:"B2", kinds:["setup","tension","action","result","close"],
    en:{t:"Teamwork", hear:"Tell me about a time you worked in a team.",
        spine:"Situation → Task → Action → Result → Close",
        keys:"hospital shoot ｜ four groups to coordinate ｜ routes and timetable planned ｜ reshot, still delivered, client won gold ｜ agree responsibilities first",
        blocks:[
          {l:"Situation", lines:["I'd use a project from our studio.","We shot a product film for a competition team, inside a working hospital.","I led the crew for that job."]},
          {l:"Task", lines:["The challenge was coordination.","We had a camera crew, our own team, the students we were filming, and hospital staff.","And the hospital was still running."]},
          {l:"Action", lines:["I planned the routes and the timetable in advance.","Everyone knew where to be, and when.","I was also the one contact for the hospital, so they knew what to expect."]},
          {l:"Result", lines:["A few scenes needed reshooting, but we still finished inside the window.","The deadline was close, so I edited the film myself, while coordinating two teammates.","We delivered on time.","The client team went on to win a national gold award."]},
          {l:"Close", lines:["What I took from it is simple.","You agree on responsibilities and timing before the work starts."]}
        ],
        notes:["Do not invent an argument. The real difficulty was the schedule, not a fight.","If the follow-up is about disagreement, switch to the persuasion script."]},
    zh:{t:"团队合作", hear:"讲一次你参与团队合作的经历。",
        spine:"情境 → 任务 → 行动 → 结果 → 收口",
        keys:"医院拍摄 ｜ 四方要协调 ｜ 提前排路线与时间表 ｜ 补拍仍按期交付、客户拿金奖 ｜ 开工前先定责任",
        labels:["情境","任务","行动","结果","收口"],
        lines:[["我用工作室的一个项目来讲。", "我们在营业中的医院里，给一个竞赛团队拍宣传片。", "那次是我带的组。"], ["难点是协调。", "现场有摄影组、我们自己的人、要拍的学生，还有医院员工。", "而且医院还在正常营业。"], ["我提前把路线和时间表排好。", "每个人清楚自己几点在哪。", "我也是医院侧的唯一对接人，让院方知道会发生什么。"], ["有几场需要补拍，但我们仍在计划窗口内完成。", "交片时间很紧，我自己上手剪辑，同时协调两个队友。", "我们按时交付了。", "客户团队后来拿了国家级金奖。"], ["我从中学到的很简单。", "开工前先把责任和时间讲清楚。"]],
        notes:["不要编一场争论。当时的真实困难是档期，不是吵架。","如果追问的是「意见不一致」，就切到说服那篇。"]}
  },
  {
    id:"s-persuade", code:"B2 · B3", kinds:["setup","tension","action","result","close"],
    en:{t:"Persuasion and leading", hear:"Describe a situation where you had to persuade others to support your idea. / How did you lead a team when faced with different opinions?",
        spine:"The squad → The disagreement → The move → Result → Close",
        keys:"intern squad ｜ engineers, front-end, QA ｜ I led the product side ｜ UI felt optional to them ｜ I drew the prototypes myself ｜ framed around their needs ｜ they agreed",
        blocks:[
          {l:"The squad", lines:["The clearest example is from ByteDance.","I was the product intern on our agent.","Around me was a small squad of other interns, engineers, front-end, and QA.","I was the one leading the product side of that squad."]},
          {l:"The disagreement", lines:["Our product did not really think about UI, or user experience.","So I raised it, and the squad pushed back.","Time was tight, and UI felt optional to them.","I was the one leading the product side, so it was on me to bring them around."]},
          {l:"The move", lines:["I didn't argue from opinion. I brought the work with me.","Before the discussion, I drew the prototypes myself.","So we were talking about a concrete proposal, not an idea.","Then I framed it around what they needed.","For the engineers, it meant a clearer spec and fewer changes later.","For my mentor, it meant a product people could actually pick up."]},
          {l:"Result", lines:["In the end they agreed, and we took it forward together."]},
          {l:"Close", lines:["What I learned about leading: do not insist you are right.","Understand what the other side is worried about, and bring evidence instead of preference,","then show them how the proposal helps them get what they need."]}
        ],
        notes:["One script covers both questions: 'persuade others' and 'lead a team when faced with different opinions'. They will not ask both separately.","The squad detail is real: engineers, front-end and QA were intern peers, and you led the product side. Do not upgrade it to managing the team.","The result stays at \"they agreed\". Do not invent a later outcome."]},
    zh:{t:"说服与带队", hear:"讲一次你让别人支持你想法的经历，你是怎么做到的？／ 作为负责人，团队意见不一致时你怎么处理？",
        spine:"小队 → 分歧 → 做法 → 结果 → 收口",
        keys:"实习生小队 ｜ 研发、前端、QA ｜ 产品侧由我牵头 ｜ UI 被当作可有可无 ｜ 我自己画原型 ｜ 围着对方的需求讲 ｜ 最后同意",
        labels:["小队","分歧","做法","结果","收口"],
        lines:[["最清楚的例子来自字节。", "我是智能体的产品实习生。", "身边是一支实习生小队：研发、前端、QA。", "产品这条线由我牵头。"], ["我们的产品基本没考虑 UI 和用户体验。", "所以我提出来，队里有人不同意。", "时间紧，UI 在他们看是可有可无的。", "产品侧是我牵的头，把大家拉到一张页面上，就是我的事。"], ["我没有拿观点去争，我把活儿先干了。", "讨论之前，我自己把原型画出来了。", "所以我们谈的是一个具体方案，不是一个想法。", "然后我围着他们需要什么讲。", "对研发来说，是规格更清楚、后面少改。", "对 mentor 来说，是用户真的能上手的产品。"], ["最后他们同意了，我们一起把它推下去。"], ["我学到的是：带头推一件事，不是坚持我是对的。", "是弄明白对方在担心什么，拿证据，不拿偏好，", "然后让他们看到这件事怎么帮他们拿到他们要的东西。"]],
        notes:["一篇稿覆盖两问：「说服别人」和「带队处理分歧」，面试官不会拆开问。","小队细节是真的：研发、前端、QA 都是实习生同学，产品侧由你牵头。不要升级成「我管理团队」。","结果句停在「他们同意了」，不要编后续。"]}
  },
  {
    id:"s-achieve", code:"B4", kinds:["setup","setup","action","result","close"],
    en:{t:"An achievement", hear:"What is the achievement you are most proud of?",
        spine:"Situation → Task → Action → Result → Close",
        keys:"the studio, from nothing ｜ co-founder ｜ data I collected myself ｜ 80k first season, two clients won gold ｜ a method beats a taste",
        blocks:[
          {l:"Situation", lines:["The one I'm most proud of is the studio.","We started it from nothing, with no clients and no portfolio."]},
          {l:"Task", lines:["We were a small media studio.","I was the co-founder, and I built our method for judging content value."]},
          {l:"Action", lines:["I collected the data myself. Several platforms, over a hundred creators, more than seven hundred videos.","Then I turned it into a scoring model, and a dashboard our clients could use."]},
          {l:"Result", lines:["In our first season, we made about 80,000 in revenue.","Two of our clients went on to win national gold awards.","That was their work, but our films helped them present it."]},
          {l:"Close", lines:["What I took from it is that a method beats a taste.","I'd rather be able to show why something works."]}
        ],
        notes:["Keep the credit clear. The awards were the clients', not yours.","Do not list the revenue without saying whose revenue it is."]},
    zh:{t:"最有成就感的事", hear:"你最引以为傲的成就是什么？",
        spine:"情境 → 任务 → 行动 → 结果 → 收口",
        keys:"工作室，从零开始 ｜ 联合创始人 ｜ 数据我自己采 ｜ 首季 8 万、两个客户拿金奖 ｜ 方法胜过品味",
        labels:["情境","任务","行动","结果","收口"],
        lines:[["我最引以为傲的是工作室。", "我们是从零开始的，没有客户，也没有作品集。"], ["我们是一个小传媒工作室。", "我是联合创始人，内容价值的评估方法是我搭的。"], ["数据是我自己采的：几个平台，一百多个创作者，七百多条视频。", "然后做成评分模型和看板，客户能直接用。"], ["第一个季度营收大约八万。", "两个客户后来拿了国家级金奖。", "那是他们的作品，我们的片子帮他们把它讲清楚了。"], ["我从中学到的是：方法论胜过手感。", "我更想能说出一个东西为什么成立。"]],
        notes:["功劳要划清：奖是客户团队拿的。","报营收时要说清是谁的收入。"]}
  },
  {
    id:"s-trend", code:"C1", kinds:["setup","action","tension","close"],
    en:{t:"A trend you're watching", hear:"What consumer or market trend have you noticed recently?",
        spine:"Answer → The mechanism → Where the work goes → Close",
        keys:"AI moves from analysis into execution ｜ in paid ads ｜ the work moves to definitions and evaluation ｜ model comes last",
        blocks:[
          {l:"Answer", lines:["The change I keep an eye on is where AI sits in a business."]},
          {l:"The mechanism", lines:["Two years ago, these tools mostly helped people look at data.","Now they take a step for you.","In paid ads, an agent can diagnose a weak account, suggest a targeting change, and drill into the numbers behind a result."]},
          {l:"Where the work goes", lines:["Once the tool can take the step, the hard part moves to what it steps on.","Is the metric defined right, and can we tell whether the answer was any good.","So on my team, the time goes into definitions and evaluation first, and the model comes last."]},
          {l:"Close", lines:["That part, I already do every day.","Turning it into something the whole team can rely on, that is what I want to learn here."]}
        ],
        notes:["Ground the trend in the business you actually sit in.","One trend, not three. A list of trends sounds like a news summary.","Do not preach about trust or human oversight. Say where your own time goes."]},
    zh:{t:"你在关注的趋势", hear:"最近你观察到什么消费趋势或市场变化？",
        spine:"结论 → 机制 → 活儿去了哪 → 收口",
        keys:"AI 从分析层进执行层 ｜ 在付费广告里 ｜ 活儿移到定义和评测上 ｜ 模型排最后",
        labels:["结论","机制","活儿去了哪","收口"],
        lines:[["我一直盯的变化，是 AI 在一家公司里的位置。"], ["两年前，这些工具主要是帮人看数据。", "现在它能替人走一步。", "在付费广告里，智能体能诊断表现差的账户，给出定向调整建议，还能下钻到结果背后的数字。"], ["工具能替你走这一步之后，难点就移到它踩着的那层东西上。", "指标定义对不对？答案好不好，判断得出来吗？", "所以在我们的团队，时间先花在定义和评测上，模型反而排在最后。"], ["这部分，我每天就在做。", "把它变成整个团队都能依赖的东西，是我想来这里学的。"]],
        notes:["趋势要落到你真正在场的业务里。","只讲一个趋势。列三个听起来像新闻摘要。","别讲「信任」「人要把关」这套大道理。就说你自己的时间去哪了。"]}
  },
  {
    id:"s-compete", code:"C2", kinds:["setup","action","action","tension","close"],
    en:{t:"Staying competitive", hear:"How can a company stay competitive in a fast-changing industry?",
        spine:"Answer → One → Two → Three → Close",
        keys:"process ｜ thinking for itself ｜ how fast you find out ｜ none of them is raw speed",
        blocks:[
          {l:"Answer", lines:["I'd describe it as three things.","And none of them is speed."]},
          {l:"One", lines:["First, can the company turn one-off success into a repeatable process?","At Meituan, our output improved because we wrote the workflows down, and judged them.","Not because someone worked harder."]},
          {l:"Two", lines:["Second, can the company think for itself?","If everyone copies the same playbook, it stops being an advantage, and becomes the cost of staying in the game.","The test is a call the market finds strange. This July, ByteDance folded Feishu into Doubao, and Feishu was doing well.","The bet is that AI rewrites how people work, and that fight is not won from a standalone product."]},
          {l:"Three", lines:["Third, and this is the one people skip: how fast can the company tell whether something is working?","Every serious company stops a project that does not pay back. That is not a difference.","The difference is how long it takes to find out — two quarters or two weeks.","That is what measurement buys you.","If you cannot tell whether last month's change helped, you are deciding by opinion.","On our agent, the evaluation system is what kept that loop short."]},
          {l:"Close", lines:["So for me, competitiveness is process, thinking for itself, and a short feedback loop."]}
        ],
        notes:["Say the three headings before the detail. They are the memory, not the examples.","On the second point, stay on not following the crowd. The Feishu case is public news, July 2026 — one line, framed as a bet, not as inside information.","Do not claim the decision alone; it was a team call, and \"we\" is accurate."]},
    zh:{t:"怎么保持竞争力", hear:"在一个快速变化的行业里，公司怎么保持竞争力？",
        spine:"结论 → 一 → 二 → 三 → 收口",
        keys:"流程化 ｜ 自己的判断 ｜ 多快能知道 ｜ 这三条都不是速度",
        labels:["结论","一","二","三","收口"],
        lines:[["我会说三件事。", "而且都不是速度。"], ["第一，能不能把一次性的成功变成可复制的流程？", "在美团，我们的产出提升是因为把流程写下来并逐项判断。", "不是因为谁更拼。"], ["第二，这家公司有没有自己的判断？", "一个行业里所有人抄同一套打法，它就不再是优势，而是留在牌桌上的成本。", "怎么看出来？看它敢不敢做一个外界觉得奇怪的决定。今年七月，字节把飞书并进了豆包，而飞书那时是蒸蒸日上的。", "他们的赌注是 AI 会重写办公，而这场仗不是从一个独立产品里打赢的。"], ["第三，也是大家最容易忽略的：多快能知道一件事到底有没有用？", "正经公司都会停掉不划算的项目，这不是差别。", "差别是多久能看出来——两个季度，还是两周。", "这就是可衡量带来的东西。", "如果说不清上个月那次改动有没有用，那就是在靠感觉做决定。", "在我们的智能体上，评测体系就是把这条回路压短的东西。"], ["所以对我来说，竞争力是流程、自己的判断，和一条短的反馈回路。"]],
        notes:["先报三个小标题，再展开。记住的是标题，不是例子。","第二点只讲「不跟风、自己有判断」；飞书那件是公开报道（2026-07 内部信：飞书与豆包产品团队整合），一句话带过，说成公开的赌注，不要讲成内幕。","不要说成你一个人的决定，那是团队判断，「我们」是准确的。"]}
  },
  {
    id:"s-tech", code:"C4", kinds:["setup","setup","action","action","tension","close"],
    en:{t:"A company that won on technology", hear:"Name a company that became successful through technology, and why.",
        spine:"Answer → Why → Mechanism one → Mechanism two → The limit → Close",
        keys:"ByteDance ｜ data and recommendation ｜ content discovery and engagement ｜ applied to ads ｜ technology alone is not enough ｜ back to management",
        blocks:[
          {l:"Answer", lines:["I'd pick ByteDance."]},
          {l:"Why", lines:["It shows how technology becomes an advantage when you understand users and the business."]},
          {l:"Mechanism one", lines:["The first thing is data and recommendation.","They use it to improve what people discover and how much they engage.","It is not traditional content distribution. It connects users, to the content they want, at scale."]},
          {l:"Mechanism two", lines:["The second thing is that they win in category after category — short video, news, novels, editing tools.","The reason is not the algorithm. It is that they start from the user.","Before anything ships, the question is what the user actually does, not what the feature can do.","In my internship, the work I was given was exactly that, the entry point, and where users get confused."]},
          {l:"The limit", lines:["One limit, though: this only works with their data and their distribution.","A smaller company cannot copy it just by saying it is user-first.","The culture is the easiest thing to copy on paper, and the hardest in practice."]},
          {l:"Close", lines:["That's exactly why I want to study management.","I want to understand not just how the technology works,","but how a company organises its resources around it, and builds an advantage that lasts."]}
        ],

  {en:{h:"Limit",lines:["That said, technology alone doesn't explain it.","I wouldn't claim more than that.","The part I can't prove is the causality."]},
   zh:{h:"划边界",lines:["That said, technology alone doesn't explain it.","I wouldn't claim more than that.","The part I can't prove is the causality."],
       gloss:["话虽如此，光有技术解释不了它。","我不会说得比这更多。","我证明不了的那部分是因果。"]}},
  {en:{h:"Close",lines:["What I took from it was…","That's why I want to learn this properly, not by trial and error.","So that's how I'd look at it."]},
   zh:{h:"收口",lines:["What I took from it was…","That's why I want to learn this properly, not by trial and error.","So that's how I'd look at it."],
       gloss:["我从里面拿到的是……","这就是为什么我想系统地学，而不是靠试错。","所以我会这样看这件事。"]}}
];

const POOL = [
  {q:"Introduce yourself and tell us what attracts you most to our programme.",b:"A1",en:{w:"No CV dump, and do not open with the film degree."},zh:{w:"别念 CV；不要用影视专业开场。"}},
  {q:"Why do you want to study management after a film degree?",b:"A1",en:{w:"Give a gap, not a job-market reason."},zh:{w:"讲能力缺口，不要讲「商科好找工作」。"}},
  {q:"What is your career plan, short term and long term?",b:"A2",en:{w:"Make the plan and the programme feed each other."},zh:{w:"让规划和项目互为因果。"}},
  {q:"How will this programme help your career?",b:"A2",en:{w:"Name the part you lack, not the prestige."},zh:{w:"说你缺的那一层，不说名气。"}},
  {q:"Describe yourself in three words.",b:"A3",en:{w:"Every word needs one fact, and one of them needs a limit."},zh:{w:"每个词都要配一个事实，其中一个要带边界。"}},
  {q:"What is a strength that others noticed before you did?",b:"A3",en:{w:"Making complicated things readable. Say who noticed it."},zh:{w:"把复杂的东西讲清楚。要说清是谁先发现的。"}},
  {q:"What kind of leader do you want to be?",b:"A3",f:{en:"Set the standard and the ownership first, then get out of the way. The hospital shoot shows it.",zh:"先讲清标准和归属，然后放手。医院拍摄那次体现的就是这个。"},en:{w:"Do not tell a control story."},zh:{w:"不要讲成「什么都是我盯着」。"}},
  {q:"What other programmes have you applied to?",b:"A4",en:{w:"Answer honestly, then name this one first choice. Do not downgrade the others."},zh:{w:"如实答，然后说这个是第一志愿；不要踩别的项目。"}},
  {q:"What was the most challenging internship you had?",b:"B1",en:{w:"Scale first, then culture. Two layers, one story."},zh:{w:"先摆体量，再讲文化。两层，一个故事。"}},
  {q:"Tell me about a time you solved a problem with almost no resources.",b:"B1",en:{w:"Meituan: feasibility over interest, 12 workflows down to 8 tools."},zh:{w:"美团：按可行性判断，12 项流程收成 8 款工具。"}},
  {q:"How did you manage competing deadlines?",b:"B1",f:{en:"The studio delivery: scenes needed reshooting, the window was fixed, you triaged and still delivered.",zh:"工作室交付：有几场要补拍、窗口是死的，你做了取舍还是按时交了。"},en:{w:"Show the triage decision, not the busy week."},zh:{w:"讲取舍的决策，不要讲「那一周好忙」。"}},
  {q:"Describe a situation where you had to persuade others to support your idea.",b:"B2",en:{w:"Use the squad story: the pushback, the prototypes, the framing."},zh:{w:"用小队那篇：分歧、原型、围着对方需求讲。"}},
  {q:"Tell me about a time you worked in a team.",b:"B2",en:{w:"The hospital shoot: responsibilities and timing agreed up front."},zh:{w:"医院拍摄：开工前先把责任和时间讲清楚。"}},
  {q:"How did you lead a team when faced with different opinions?",b:"B2",en:{w:"Same script as persuasion: the intern squad, the UI pushback."},zh:{w:"和说服题同一篇：实习生小队、UI 的分歧。"}},
  {q:"Describe a time you took ownership of something.",b:"B3",en:{w:"What you decided and owned, not what the team did."},zh:{w:"讲你决定了什么、拥有什么，不是团队做了什么。"}},
  {q:"What is the achievement you are most proud of?",b:"B4",en:{w:"Do not take the team's credit. The clients won the award."},zh:{w:"不要抢功。奖是客户团队拿的。"}},
  {q:"Tell me about a time you failed.",b:"B4",f:{en:"No prepared story yet. Pick a real one and build it before the real interview.",zh:"还没有稿。挑一件真事，正式面试前补出来。"},en:{w:"Do not fake a failure, and do not turn it into a humble-brag."},zh:{w:"不要编，也不要讲成变相自夸。"}},
  {q:"How do you take feedback?",b:"B4",f:{en:"On the agent evaluation we threw out the invalid answers before claiming the number, because it had to survive scrutiny.",zh:"做智能体评测时，我们先剔除无效答案再报数，因为这个数要经得起追问。"},en:{w:"Show that you care about being right, not about looking right."},zh:{w:"体现你在乎「对」，不是在乎「好看」。"}},
  {q:"What consumer trends have you noticed in recent years?",b:"C1",en:{w:"AI moved from analysis into execution. Ground it in paid ads."},zh:{w:"AI 从分析层进到执行层。落到付费广告里讲。"}},
  {q:"How has lifestyle change affected business strategy?",b:"C1",f:{en:"Pick one shift, give the mechanism it creates, then the limit of the claim.",zh:"挑一个变化，讲它带来的机制，再说这条判断的边界。"},en:{w:"Give a mechanism, not a list of habits."},zh:{w:"讲机制，不要列一堆生活习惯。"}},
  {q:"How can a company stay competitive in a fast-changing industry?",b:"C2",en:{w:"Process, thinking for itself, a short feedback loop. Speed is not the answer."},zh:{w:"流程化、自己的判断、短反馈回路。速度不是答案。"}},
  {q:"If you started a technology company, what problem would you solve?",b:"C2",f:{en:"Evaluation infrastructure for AI products: a way to check whether a tool works before it spreads.",zh:"做 AI 产品的评测基建：让公司在推广之前能验证一个工具到底行不行。"},en:{w:"Sell the ruler, not the tool."},zh:{w:"卖尺子，不卖工具。"}},
  {q:"How do you measure whether marketing spend worked?",b:"C3",en:{w:"Incrementality and holdout. A low cost per acquisition can be a trap."},zh:{w:"看增量、用 holdout 对照。低 CPA 可能是陷阱。"}},
  {q:"What role does brand building play in a company's success?",b:"C3",en:{w:"It keeps working after the spending stops. Loyalty is different from satisfaction."},zh:{w:"钱停花之后它还在起作用。忠诚和满意不是一回事。"}},
  {q:"Name a company that became successful through technology, and why.",b:"C4",en:{w:"Six blocks. Never stop at \u201Cbecause it has technology\u201D."},zh:{w:"六个块。不要停在「因为它有技术」。"}},
  {q:"How should humans and technology work together?",b:"C4",f:{en:"People set the frame, the agent drafts, people make the final call, and every review feeds the next iteration.",zh:"人定框架，智能体起草，人拍板；每一轮评审结果都进下一次迭代。"},en:{w:"Say which step people own, rather than saying technology should do more."},zh:{w:"说清哪一步归人，而不是说技术该做更多。"}},
  {q:"What business or market have you been watching lately?",b:"C5",en:{w:"First-hand only: your own paid ads line."},zh:{w:"只用一手观察：你所在的付费广告投放线。"}},
  {q:"If you could create a new emoji, what would it look like and what would it mean?",b:"D1",en:{w:"Four beats. No link to management needed."},zh:{w:"四拍。不必扣管理。"}},
  {q:"Create a holiday that does not exist yet.",b:"D1",en:{w:"First Draft Day: one day for unfinished work. Give it a picture."},zh:{w:"初稿节：一天只展示没做完的东西。要给出画面。"}},
  {q:"If you could have one superpower, what would it be?",b:"D1",en:{w:"Seeing how a number was calculated. Use it, do not just name it."},zh:{w:"一眼看清一个数字是怎么算出来的。要用起来，不能只报名字。"}},
  {q:"You win a billion dollars. What are the first three things you do?",b:"D2",en:{w:"Knowledge, then capability, then people. An order, not a list."},zh:{w:"先认知，再能力，最后放人。给顺序，别列清单。"}},
  {q:"If you could pause time for one day, what would you do?",b:"D2",en:{w:"One moment, not a montage."},zh:{w:"讲一个瞬间，不要放一段蒙太奇。"}},
  {q:"If you could remove one fear from the world, what would it be?",b:"D2",en:{w:"The fear of saying \u201CI don't know\u201D. Back it with the evaluation work."},zh:{w:"怕说「我不知道」。用评测那件事撑着。"}},
  {q:"If your life story became a book, what would the title be?",b:"D3",en:{w:"Keep it dry. No sentimentality."},zh:{w:"讲得干一点，别煽情。"}},
  {q:"Which historical figure would you most like to meet?",b:"D3",en:{w:"Miyazaki, and ask how a creative team keeps one standard for forty years."},zh:{w:"宫崎骏。问他：一支创作团队怎么四十年保持同一个标准。"}},
  {q:"If you could talk to any animal, which one, and what would you ask?",b:"D3",en:{w:"Bees: how does an organisation with no manager coordinate?"},zh:{w:"蜜蜂：一个没有 manager 的组织怎么协调。"}}
];

/* ================= render ================= */
const $ = id => document.getElementById(id);
let LANG = "en", treeFilter = "all", drawn = 0, timer = null;
const clockState = {q:null, chosen:null, stage:"idle", left:20, speaking:false};

const t = () => UI[LANG];
const pick = o => o[LANG];
const blockLabel = (sc, i) => LANG === "zh" && sc.zh.labels ? sc.zh.labels[i] : sc.en.blocks[i].l;

function renderRail(){
  const u = t();
  $("brand").innerHTML = u.brand;
  const secIds = ["loop","tree","stories","spines","scripts","drill"];
  let html = `<div class="sec">${u.navSec}</div>`;
  html += `<a href="#day" data-sec="day">${u.daySec}</a>`;
  secIds.forEach((id,i)=>{ html += `<a href="#${id}" data-sec="${id}">${i+1} · ${u.sec[i]}</a>`; });
  html += `<div class="sec rail-head">${u.navScripts}</div>`;
  SCRIPTS.forEach(sc=>{ html += `<a class="sub" href="#${sc.id}" data-sub="${sc.id}">${pick(sc).t}</a>`; });
  $("railnav").innerHTML = html;
}

function renderStatic(){
  const u = t();
  document.documentElement.lang = LANG === "zh" ? "zh-CN" : "en";
  $("lang-en").setAttribute("aria-pressed", String(LANG==="en"));
  $("lang-zh").setAttribute("aria-pressed", String(LANG==="zh"));
  ["loop","tree","stories","spines","scripts","drill"].forEach((id,i)=>{
    $(id+"-h").innerHTML = `<b>${i+1}</b> · ${u.sec[i]}`;
    $(id+"-lead").textContent = u.leads[i];
  });
  $("tree-note").innerHTML = u.treeNote;
  $("day-h").innerHTML = u.daySec;
  $("day-box").innerHTML = `<h3>${u.dayTitle}</h3><p class="deadline">${u.dayDeadline}</p>
    <ul>${u.daySteps.map(x=>`<li>${x}</li>`).join("")}</ul>
    <p class="focushint">${u.dayHelp}</p>`;
  $("loop-grid").innerHTML = LOOP_STEPS.map((s,i)=>`<div class="step${s.key?" key":""}">
    <span class="n">${u.stepN} ${i+1}</span><h3>${pick(s).h}</h3><p>${pick(s).p}</p></div>`).join("");
  $("chips").innerHTML = u.chips.map((c,i)=>`<span class="chip${i===1?" hot":""}">${c}</span>`).join("");
  $("changed").innerHTML = u.changed.map(c=>`<div>${c}</div>`).join("");
  $("foot").textContent = u.foot;
  $("draw").textContent = u.draw; $("again").textContent = u.again;
  $("prep").textContent = u.prep; $("speak").textContent = u.speak;
  $("clock-h").textContent = u.clockH;
  $("togall").textContent = u.expand;
  $("scount").textContent = SCRIPTS.length + u.scount;
  $("stats").textContent = drawn + (drawn===1 ? u.statOne : u.statMany);
  $("brand").innerHTML = u.brand;
}

function renderTree(){
  const u = t();
  $("tabs").innerHTML = u.tabs.map((label,i)=>{
    const f = ["all","A","B","C","D"][i];
    return `<button data-f="${f}" aria-pressed="${String(treeFilter===f)}">${label}</button>`;
  }).join("");
  const body = $("tree-body");
  body.innerHTML = "";
  ["A","B","C","D"].forEach(b=>{
    if(treeFilter!=="all" && treeFilter!==b) return;
    const br = pick(BRANCH[b]);
    const head = document.createElement("div");
    head.className = "branch-title";
    head.innerHTML = `<h3>${br.name}</h3><span>${br.hint}</span>`;
    body.appendChild(head);
    const grid = document.createElement("div");
    grid.className = "leaves";
    LEAVES.filter(l=>l.b===b).forEach(l=>{
      const d = pick(l);
      const el = document.createElement("div");
      el.className = "leaf";
      el.innerHTML = `<span class="id">${l.id}</span><h4>${d.t}</h4><p class="tests">${d.q}</p>
        <div class="fill"><b>${u.fillLabel}:</b> ${d.f}</div>`;
      grid.appendChild(el);
    });
    body.appendChild(grid);
  });
}

function renderStories(){
  $("story-grid").innerHTML = STORIES.map((s,i)=>{
    const d = pick(s);
    return `<div class="story"><h3>${i+1}. ${d.name}</h3><span class="tag">${d.tag}</span>
      <ul>${d.facts.map(f=>`<li>${f}</li>`).join("")}</ul><p class="close">${d.close}</p></div>`;
  }).join("");
}

function renderSpines(){
  $("spine-grid").innerHTML = SPINES.map(s=>{const d=pick(s);
    return `<div class="spine"><h3>${d.n}</h3><div class="use">${d.u}</div><p>${d.p}</p></div>`;}).join("");
  $("frame-grid").innerHTML = FRAMES.map(f=>{
    const d = pick(f);
    const lines = d.lines.map((l,i)=>`<p>${l}${LANG==="zh"&&d.gloss?`<span class="gloss">${d.gloss[i]}</span>`:""}</p>`).join("");
    return `<div class="frame"><h4>${d.h}</h4>${lines}</div>`;
  }).join("");
}

function renderScripts(){
  const u = t();
  $("legend").innerHTML = ["setup","tension","action","result","close"]
    .map((k,i)=>`<span class="k-${k}"><i></i>${u.legend[i]}</span>`).join("");
  $("script-list").innerHTML = SCRIPTS.map((sc,idx)=>{
    const d = pick(sc), kinds = sc.kinds;
    const spineLine = sc.en.blocks.map((b,i)=>blockLabel(sc,i)).join(" → ");
    const board = sc.en.blocks.map((b,i)=>{
      const k = kinds[i] || "setup";
      const zhL = (LANG === "zh" && sc.zh.lines && sc.zh.lines[i]) ? sc.zh.lines[i] : null;
      const body = zhL
        ? zhL.map(x=>`<p class="zh">${x}</p>`).join("") + b.lines.map(l=>`<p class="sub">${l}</p>`).join("")
        : b.lines.map(l=>`<p>${l}</p>`).join("");
      return `<div class="blk k-${k}">
        <div class="bhead"><span class="bnum">${i+1}</span><span class="blab">${blockLabel(sc,i)}</span></div>
        ${body}
      </div>`;
    }).join("");
    let tbl = "";
    if(sc.en.table){
      const T = (LANG === "zh" && sc.zh.table) ? sc.zh.table : sc.en.table;
      tbl = `<table class="claimtable"><thead><tr>${T.head.map(h=>`<th>${h}</th>`).join("")}</tr></thead>
        <tbody>${T.rows.map(r=>`<tr>${r.map((c,i)=>`<td${i>0?' class="q"':''}>${c}</td>`).join("")}</tr>`).join("")}</tbody></table>`;
    }
    return `<details class="script" id="${sc.id}"${idx===0?" open":""}>
      <summary>
        <div class="stitle"><span>${d.t}</span><span class="code">${sc.code}</span><span class="plus">＋</span></div>
        <p class="shell">${u.hearLabel}: ${d.hear}</p>
        <p class="spine-line">${spineLine}</p>
      </summary>
      <div class="sbody">
        <p class="keys">${u.keyLabel}: ${d.keys}</p>
        <div class="board">${board}</div>
        ${tbl}
        <p class="focushint">${u.focusHint}</p>
        ${d.notes.map(n=>`<p class="script-note">${n}</p>`).join("")}
      </div></details>`;
  }).join("");
}

/* ---------- drill ---------- */
function renderDrill(){
  const u = t();
  if(!clockState.q){
    $("qtext").textContent = u.idle; $("guess").style.display="none"; $("feedback").innerHTML="";
    $("clock").innerHTML = `20<small>${u.prepUnit}</small>`; $("hint").textContent = u.hintIdle;
    $("draw").style.display="inline-block"; $("again").style.display="none";
    $("prep").disabled = true; $("speak").disabled = true; return;
  }
  $("qtext").textContent = clockState.q.q;
  const leaf = LEAVES.find(l=>l.id===clockState.q.b), d = pick(leaf), g = $("guess");
  g.style.display = "flex";
  if(clockState.stage === "idle"){
    g.innerHTML = ["A","B","C","D"].map(b=>`<button type="button" data-b="${b}">${pick(BRANCH[b]).name}</button>`).join("");
    $("feedback").innerHTML = ""; $("hint").textContent = u.hintIdle;
    $("prep").disabled = true; $("speak").disabled = true;
  } else {
    [...g.querySelectorAll("button")].forEach(btn=>{
      btn.disabled = true;
      if(btn.dataset.b === leaf.b) btn.classList.add("right");
      else if(btn.dataset.b === clockState.chosen) btn.classList.add("wrong");
    });
    const lead = clockState.chosen === leaf.b
      ? `<b>${u.correct} ${leaf.id} ${d.t}.</b> ${d.q}` : `<i>${u.sits} ${leaf.b}.</i> ${d.q}`;
    const f = clockState.q.f ? clockState.q.f[LANG] : d.f;
    $("feedback").innerHTML = `${lead}<br><b>${u.useLabel}</b> ${f}<br><i>${u.watchLabel}</i> ${clockState.q[LANG].w}`;
    if(clockState.stage === "guessed") $("hint").textContent = u.hintPrep;
  }
  const label = clockState.speaking ? u.speakUnit : u.prepUnit;
  $("clock").innerHTML = `${clockState.left}<small>${label}</small>`;
  $("draw").style.display = "none";
}

function stopTimer(){ if(timer){ clearInterval(timer); timer = null; } }

function drawQuestion(){
  stopTimer();
  clockState.q = POOL[Math.floor(Math.random()*POOL.length)];
  clockState.chosen = null; clockState.stage = "idle"; clockState.left = 20; clockState.speaking = false;
  drawn++;
  $("stats").textContent = drawn + (drawn===1 ? t().statOne : t().statMany);
  $("fill").style.width = "0%"; $("bar").classList.remove("speaking");
  renderDrill();
}

function runClock(seconds, speaking){
  const u = t();
  stopTimer();
  clockState.stage = speaking ? "speaking" : "prep";
  clockState.speaking = speaking; clockState.left = seconds;
  $("fill").style.width = "0%";
  $("bar").classList.toggle("speaking", speaking);
  $("bar").querySelector(".mark").style.left = (speaking ? (150/180*100) : 0) + "%";
  $("hint").textContent = speaking ? u.hintSpeaking : u.hintPrep;
  $("prep").disabled = true; $("speak").disabled = true;
  $("clock").innerHTML = `${clockState.left}<small>${speaking ? u.speakUnit : u.prepUnit}</small>`;
  timer = setInterval(()=>{
    clockState.left--;
    $("fill").style.width = Math.min(100, (seconds-clockState.left)/seconds*100) + "%";
    $("clock").innerHTML = `${clockState.left}<small>${clockState.speaking ? t().speakUnit : t().prepUnit}</small>`;
    if(clockState.left <= 0){
      stopTimer(); clockState.left = 0;
      $("clock").innerHTML = `0<small>${clockState.speaking ? t().speakUnit : t().prepUnit}</small>`;
      if(!speaking){ clockState.stage = "prepDone"; $("hint").textContent = u.hintTimePrep; $("speak").disabled = false; }
      else { clockState.stage = "done"; $("hint").textContent = u.hintTimeSpeak; $("again").style.display = "inline-block"; }
    }
  }, 1000);
}

function renderAll(){
  renderRail(); renderStatic(); renderTree(); renderStories(); renderSpines(); renderScripts(); renderDrill();
  if(clockState.stage === "prepDone") $("speak").disabled = false;
  if(clockState.stage === "done") $("again").style.display = "inline-block";
  observeSections();
}

/* ---------- events ---------- */
document.body.addEventListener("click", e=>{
  const blk = e.target.closest(".blk");
  if(blk){
    const board = blk.closest(".board");
    if(blk.classList.contains("focus")){ blk.classList.remove("focus"); board.classList.remove("focusing"); }
    else {
      board.querySelectorAll(".blk").forEach(b=>b.classList.remove("focus"));
      blk.classList.add("focus"); board.classList.add("focusing");
    }
    return;
  }
  const tab = e.target.closest("#tabs button");
  if(tab){ treeFilter = tab.dataset.f; renderTree(); return; }
  const g = e.target.closest("#guess button");
  if(g && !g.disabled){ clockState.chosen = g.dataset.b; clockState.stage = "guessed"; renderDrill(); $("prep").disabled = false; return; }
  if(e.target.closest("#draw") || e.target.closest("#again")){ drawQuestion(); return; }
  if(e.target.closest("#prep")){ runClock(20,false); return; }
  if(e.target.closest("#speak")){ runClock(180,true); return; }
  if(e.target.closest("#lang-en")){ setLang("en"); return; }
  if(e.target.closest("#lang-zh")){ setLang("zh"); return; }
  const ta = e.target.closest("#togall");
  if(ta){
    const open = $("togall").dataset.open === "1";
    document.querySelectorAll("details.script").forEach(d=>{ d.open = !open; });
    $("togall").dataset.open = open ? "0" : "1";
    $("togall").textContent = open ? t().expand : t().collapse;
  }
});

function observeSections(){
  if(!("IntersectionObserver" in window)) return;
  const links = [...document.querySelectorAll(".rail nav a")];
  const io = new IntersectionObserver(entries=>{
    entries.forEach(en=>{
      if(!en.isIntersecting) return;
      const id = en.target.id;
      links.forEach(a=>{
        const hit = a.dataset.sec === id || a.dataset.sub === id;
        a.classList.toggle("on", hit);
      });
    });
  }, {rootMargin:"-10% 0px -80% 0px", threshold:0});
  document.querySelectorAll("section[id], details.script[id]").forEach(el=>io.observe(el));
}

function setLang(l){
  LANG = l;
  try{ localStorage.setItem("ic-lang", l); }catch(e){}
  renderAll();
}

try{ const s = localStorage.getItem("ic-lang"); if(s === "zh" || s === "en") LANG = s; }catch(e){}
renderAll();
</script>
